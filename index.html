<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adarsh Verma — Junior Software Engineer</title>
<meta name="description" content="Portfolio of Adarsh Verma, Junior Software Engineer and Frontend Developer building responsive, animated web experiences.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* ---------- THEME TOKENS ---------- */
  :root {
    --font-sans: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --font-display: 'Sora', 'Inter', system-ui, sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

    --bg: #f6f8fc;
    --bg-elev: #eef2f9;
    --surface: #ffffff;
    --surface2: #eef2f9;
    --border: rgba(15, 23, 42, 0.08);
    --border-strong: rgba(15, 23, 42, 0.16);
    --text: #0f172a;
    --text-muted: #4b5568;
    --text-faint: #8a94a8;
    --accent: #2f5fe8;
    --accent-2: #0ea5e9;
    --accent-glow: rgba(47, 95, 232, 0.14);
    --accent-soft: rgba(47, 95, 232, 0.08);
    --tag-bg: rgba(47, 95, 232, 0.07);
    --tag-text: #2c3e6b;
    --success: #10b981;
    --grid-line: rgba(15, 23, 42, 0.045);
    --orb-opacity: 0.22;
    --shadow: 0 10px 30px -12px rgba(15, 23, 42, 0.18);

    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    --transition: 0.2s ease;
  }

  [data-theme="dark"] {
    --bg: #0a0f1c;
    --bg-elev: #0d1424;
    --surface: #111a2e;
    --surface2: #17223a;
    --border: rgba(148, 163, 184, 0.12);
    --border-strong: rgba(148, 163, 184, 0.22);
    --text: #e6edf7;
    --text-muted: #9aa8bf;
    --text-faint: #5f6d85;
    --accent: #5b8cff;
    --accent-2: #7dd3fc;
    --accent-glow: rgba(91, 140, 255, 0.22);
    --accent-soft: rgba(91, 140, 255, 0.10);
    --tag-bg: rgba(91, 140, 255, 0.08);
    --tag-text: #b8c7e6;
    --success: #34d399;
    --grid-line: rgba(148, 163, 184, 0.06);
    --orb-opacity: 0.32;
    --shadow: 0 16px 40px -16px rgba(0, 0, 0, 0.6);
  }

  html { scroll-behavior: smooth; }
  html.theming *, html.theming *::before, html.theming *::after {
    transition: background-color 0.45s ease, color 0.45s ease, border-color 0.45s ease, box-shadow 0.45s ease !important;
  }

  body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    position: relative;
  }

  /* ---------- BACKGROUND LAYERS ---------- */
  .bg-grid {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 48px 48px;
    -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 0%, #000 30%, transparent 100%);
            mask-image: radial-gradient(ellipse 70% 60% at 50% 0%, #000 30%, transparent 100%);
  }
  .spotlight {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: radial-gradient(640px circle at var(--mx, 50%) var(--my, 20%), var(--accent-glow), transparent 65%);
    opacity: 0;
    transition: opacity 0.6s ease;
  }
  body.has-pointer .spotlight { opacity: 1; }
  .orb {
    position: fixed; border-radius: 50%; pointer-events: none; z-index: 0;
    filter: blur(90px);
    opacity: var(--orb-opacity);
    animation: drift 22s ease-in-out infinite alternate;
    will-change: transform;
  }
  .orb-1 { width: 460px; height: 460px; background: var(--accent); top: -160px; right: -120px; }
  .orb-2 { width: 380px; height: 380px; background: var(--accent-2); bottom: -180px; left: -140px; animation-delay: -11s; }
  @keyframes drift {
    0%   { transform: translate3d(0, 0, 0) scale(1); }
    50%  { transform: translate3d(-40px, 30px, 0) scale(1.08); }
    100% { transform: translate3d(30px, -25px, 0) scale(0.96); }
  }

  .shell {
    position: relative; z-index: 1;
    width: 100%;
    max-width: 1040px;
    margin: 0 auto;
    padding: 2rem 1.5rem 4rem;
  }

  /* ---------- ENTRANCE ANIMATIONS ---------- */
  .reveal {
    opacity: 0;
    animation: riseIn 0.7s var(--ease) forwards;
    animation-delay: calc(var(--d, 0) * 1ms);
  }
  @keyframes riseIn {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .stagger {
    opacity: 0;
    animation: riseIn 0.5s var(--ease) forwards;
  }

  /* ---------- TOP BAR ---------- */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 3.5rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid var(--border);
    animation: slideDown 0.6s var(--ease) both;
  }
  @keyframes slideDown { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: none; } }
  .topbar-left {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-faint);
    letter-spacing: 0.04em;
    display: flex; align-items: center; gap: 8px;
  }
  .topbar-left .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  .topbar-right { display: flex; align-items: center; gap: 1.6rem; }
  .nav-links { display: flex; gap: 1.5rem; }
  .nav-link {
    position: relative;
    font-family: var(--font-sans);
    font-size: 13px;
    font-weight: 500;
    color: var(--text-muted);
    cursor: pointer;
    background: none; border: none; padding: 2px 0;
    transition: color var(--transition), transform 0.15s ease;
  }
  .nav-link::after {
    content: ''; position: absolute; left: 0; bottom: -3px;
    width: 100%; height: 1.5px; background: var(--accent);
    transform: scaleX(0); transform-origin: right;
    transition: transform 0.3s var(--ease);
  }
  .nav-link:hover { color: var(--text); transform: translateY(-1px); }
  .nav-link:hover::after { transform: scaleX(1); transform-origin: left; }

  /* ---------- THEME TOGGLE ---------- */
  .theme-toggle {
    width: 44px; height: 24px;
    background: var(--surface2);
    border: 1px solid var(--border-strong);
    border-radius: 12px;
    cursor: pointer; position: relative; flex-shrink: 0;
    transition: background var(--transition), transform 0.15s ease, border-color var(--transition);
  }
  .theme-toggle:hover { transform: scale(1.06); border-color: var(--accent); }
  .theme-toggle:active { transform: scale(0.95); }
  .theme-toggle::after {
    content: ''; position: absolute; top: 3px; left: 3px;
    width: 16px; height: 16px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
    transition: transform 0.35s var(--ease);
  }
  [data-theme="dark"] .theme-toggle::after { transform: translateX(20px); }

  /* ---------- HERO ---------- */
  .hero { margin-bottom: 3rem; }
  .hero-prompt {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--accent);
    margin-bottom: 0.8rem;
    letter-spacing: 0.04em;
  }
  .hero-title {
    font-family: var(--font-display);
    font-size: clamp(2.6rem, 6.5vw, 4.4rem);
    font-weight: 800;
    line-height: 1;
    letter-spacing: -0.035em;
    display: flex; align-items: baseline; flex-wrap: wrap;
  }
  .hero-name { display: inline-block; white-space: nowrap; }
  .hero-name .char {
    display: inline-block;
    opacity: 0;
    transform: translateY(24px) rotateX(-40deg);
    animation: charIn 0.55s var(--ease) forwards;
    /* each letter carries the gradient, offset so it spans the whole name */
    background: linear-gradient(92deg, var(--text) 0%, var(--accent) 55%, var(--accent-2) 100%);
    background-size: var(--w, 100%) 100%;
    background-position: calc(-1 * var(--x, 0px)) 0;
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
  }
  @keyframes charIn { to { opacity: 1; transform: translateY(0) rotateX(0); } }
  .cursor {
    display: inline-block;
    color: var(--accent);
    font-weight: 700;
    margin-left: 6px;
    animation: blink 1.1s step-end infinite;
  }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

  .hero-subtitle {
    font-size: 15px;
    color: var(--text-muted);
    margin-top: 1.2rem;
    line-height: 1.7;
    display: flex; align-items: center; flex-wrap: wrap; gap: 6px;
  }
  .hero-subtitle strong { color: var(--text); font-weight: 600; }
  .hero-typed {
    font-size: 14px;
    color: var(--text-muted);
    margin-top: 0.35rem;
    min-height: 1.6em;
  }
  .hero-typed .typed { color: var(--accent); font-weight: 500; }
  .hero-typed .type-cursor {
    display: inline-block; width: 2px; height: 1em; background: var(--accent);
    vertical-align: -2px; margin-left: 2px;
    animation: blink 0.9s step-end infinite;
  }
  .hero-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 1.3rem; }
  .tag {
    font-family: var(--font-mono);
    font-size: 11px;
    background: var(--tag-bg);
    color: var(--tag-text);
    padding: 4px 11px;
    border-radius: 999px;
    letter-spacing: 0.02em;
    border: 1px solid var(--border);
    transition: background var(--transition), transform 0.2s var(--ease), border-color var(--transition), color var(--transition);
  }
  .hero-tags .tag { opacity: 0; transform: translateY(8px); animation: tagIn 0.45s var(--ease) forwards; }
  @keyframes tagIn { to { opacity: 1; transform: translateY(0); } }
  .tag:hover { transform: translateY(-2px); border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

  /* ---------- OPEN SECTION ---------- */
  .open-section { margin-bottom: 2rem; }
  .cmd-line {
    display: flex; align-items: center; gap: 8px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 12px;
  }
  .cmd-line span { color: var(--accent); }
  .section-buttons { display: flex; flex-wrap: wrap; gap: 10px; }
  .section-btn {
    position: relative; overflow: hidden;
    font-family: var(--font-mono);
    font-size: 12px;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    color: var(--text-muted);
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    letter-spacing: 0.02em;
    transition: color var(--transition), border-color var(--transition), transform 0.2s var(--ease), box-shadow 0.25s ease, background var(--transition);
  }
  .section-btn::before { content: 'open '; opacity: 0.45; }
  .section-btn::after {
    content: ''; position: absolute; top: 0; left: -80%; width: 50%; height: 100%;
    background: linear-gradient(115deg, transparent, rgba(255,255,255,0.28), transparent);
    transform: skewX(-20deg);
    transition: left 0.55s ease;
  }
  .section-btn:hover { color: var(--text); border-color: var(--accent); transform: translateY(-2px); box-shadow: var(--shadow); }
  .section-btn:hover::after { left: 130%; }
  .section-btn:active { transform: translateY(0); }

  /* ---------- TABS BAR ---------- */
  .tabs-bar {
    display: flex; align-items: center;
    border: 1px solid var(--border-strong);
    border-bottom: none;
    border-radius: 10px 10px 0 0;
    background: var(--bg-elev);
    overflow-x: auto; scrollbar-width: none;
    min-height: 38px;
  }
  .tabs-bar::-webkit-scrollbar { display: none; }
  .tab {
    position: relative;
    display: flex; align-items: center; gap: 10px;
    font-family: var(--font-mono);
    font-size: 12px;
    padding: 9px 16px;
    border-right: 1px solid var(--border);
    cursor: pointer;
    color: var(--text-muted);
    transition: background var(--transition), color var(--transition);
    white-space: nowrap;
    user-select: none;
    animation: tabPop 0.3s var(--ease);
  }
  @keyframes tabPop { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .tab::before {
    content: ''; position: absolute; left: 0; right: 0; top: 0; height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    transform: scaleX(0); transition: transform 0.3s var(--ease);
  }
  .tab.active { background: var(--surface); color: var(--text); }
  .tab.active::before { transform: scaleX(1); }
  .tab:hover:not(.active) { background: var(--surface2); color: var(--text); }
  .tab-close {
    width: 16px; height: 16px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 4px; font-size: 14px; opacity: 0.5;
    transition: opacity var(--transition), background var(--transition), transform 0.2s ease;
    font-family: var(--font-sans);
  }
  .tab-close:hover { opacity: 1; background: var(--accent-soft); color: var(--accent); transform: rotate(90deg); }

  /* ---------- TAB CONTENT ---------- */
  .tab-content {
    border: 1px solid var(--border-strong);
    padding: 2.2rem;
    background: var(--surface);
    min-height: 280px;
    border-radius: 0 0 12px 12px;
    box-shadow: var(--shadow);
    animation: contentIn 0.4s var(--ease);
  }
  @keyframes contentIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  .no-tabs {
    text-align: center;
    padding: 3rem 1rem;
    color: var(--text-faint);
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.03em;
    border: 1px dashed var(--border-strong);
    border-radius: 12px;
  }

  /* ---------- SECTION CONTENT ---------- */
  .section-header {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 0.12em;
    margin-bottom: 1.5rem;
    text-transform: uppercase;
    display: flex; align-items: center; gap: 10px;
  }
  .section-header::before { content: '#'; opacity: 0.5; }
  .section-header::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  /* About */
  .about-text {
    font-size: 15px;
    line-height: 1.85;
    color: var(--text-muted);
    max-width: 640px;
    margin-bottom: 1.8rem;
  }
  .about-text strong { color: var(--text); font-weight: 600; }
  .skills-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 8px;
    margin-top: 1rem;
  }
  .skill-item {
    font-size: 12.5px;
    font-weight: 500;
    color: var(--text-muted);
    padding: 9px 12px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    display: flex; align-items: center; gap: 8px;
    transition: border-color var(--transition), color var(--transition), transform 0.25s var(--ease), box-shadow 0.25s ease, background var(--transition);
  }
  .skill-item::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); opacity: 0.6; transition: opacity var(--transition), transform 0.25s var(--ease); flex-shrink: 0; }
  .skill-item:hover { border-color: var(--accent); color: var(--text); transform: translateY(-3px); box-shadow: var(--shadow); background: var(--surface); }
  .skill-item:hover::before { opacity: 1; transform: scale(1.4); }

  /* Projects */
  .projects-list { display: flex; flex-direction: column; }
  .project-item {
    position: relative;
    padding: 1.1rem 0.9rem;
    border-bottom: 1px solid var(--border);
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 1rem;
    align-items: start;
    cursor: pointer;
    border-radius: 10px;
    transition: background var(--transition), transform 0.3s var(--ease);
  }
  .project-item::before {
    content: ''; position: absolute; left: 0; top: 14px; bottom: 14px; width: 3px;
    border-radius: 3px;
    background: linear-gradient(180deg, var(--accent), var(--accent-2));
    transform: scaleY(0); transition: transform 0.3s var(--ease);
  }
  .project-item:last-child { border-bottom: none; }
  .project-item:hover { background: var(--surface2); transform: translateX(6px); }
  .project-item:hover::before { transform: scaleY(1); }
  .project-name {
    font-family: var(--font-display);
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 5px;
    letter-spacing: -0.01em;
    transition: color var(--transition);
  }
  .project-item:hover .project-name { color: var(--accent); }
  .project-desc { font-size: 13px; color: var(--text-muted); line-height: 1.75; }
  .project-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .project-meta {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-faint);
    text-align: right;
    white-space: nowrap;
    line-height: 1.6;
    transition: color var(--transition);
  }
  .project-item:hover .project-meta { color: var(--text-muted); }

  /* Experience */
  .exp-list { display: flex; flex-direction: column; }
  .exp-item {
    display: grid;
    grid-template-columns: 100px 1fr;
    gap: 1.5rem;
    padding: 0.2rem 0;
  }
  .exp-year {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-faint);
    padding-top: 1.1rem;
    line-height: 1.6;
  }
  .exp-body {
    position: relative;
    padding: 1rem 0 1.4rem 1.6rem;
    border-left: 1px solid var(--border-strong);
  }
  .exp-item:last-child .exp-body { padding-bottom: 0.4rem; }
  .exp-body::before {
    content: ''; position: absolute; left: -5px; top: 1.3rem;
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 3px var(--surface), 0 0 0 4px var(--border-strong);
    transition: transform 0.3s var(--ease), box-shadow 0.3s ease;
  }
  .exp-item:hover .exp-body::before { transform: scale(1.3); box-shadow: 0 0 0 3px var(--surface), 0 0 0 8px var(--accent-soft); }
  .exp-role {
    font-family: var(--font-display);
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 3px;
    transition: color var(--transition);
  }
  .exp-item:hover .exp-role { color: var(--accent); }
  .exp-company { font-size: 12.5px; color: var(--text-muted); margin-bottom: 8px; font-weight: 500; }
  .exp-desc { font-size: 13px; color: var(--text-muted); line-height: 1.75; }

  /* Contact */
  .contact-list { display: flex; flex-direction: column; }
  .contact-item {
    display: flex; align-items: center; gap: 1rem;
    padding: 0.9rem 0;
    border-bottom: 1px solid var(--border);
  }
  .contact-item:last-child { border-bottom: none; }
  .contact-label {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-faint);
    width: 90px; flex-shrink: 0;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .contact-value {
    position: relative;
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    text-decoration: none;
    transition: color var(--transition);
  }
  .contact-value::after {
    content: ''; position: absolute; left: 0; bottom: -2px; width: 100%; height: 1.5px;
    background: var(--accent);
    transform: scaleX(0); transform-origin: right; transition: transform 0.3s var(--ease);
  }
  .contact-value:hover { color: var(--accent); }
  .contact-value:hover::after { transform: scaleX(1); transform-origin: left; }
  .contact-note { font-size: 13px; color: var(--text-muted); margin-top: 1.6rem; line-height: 1.8; }

  /* Status dot */
  .status-dot {
    position: relative;
    width: 8px; height: 8px;
    background: var(--success);
    border-radius: 50%;
    display: inline-block;
    margin-right: 6px;
    vertical-align: middle;
  }
  .status-dot::after {
    content: ''; position: absolute; inset: -3px; border-radius: 50%;
    border: 1.5px solid var(--success);
    animation: ping 1.8s var(--ease) infinite;
  }
  @keyframes ping { 0% { transform: scale(0.6); opacity: 0.9; } 100% { transform: scale(2); opacity: 0; } }

  /* ---------- FOOTER ---------- */
  .footer {
    margin-top: 3.5rem;
    padding-top: 1.2rem;
    border-top: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-faint);
  }

  /* ---------- RESPONSIVE ---------- */
  @media (max-width: 768px) {
    .shell { padding: 1.4rem 1.1rem 3rem; }
    .topbar { margin-bottom: 2.5rem; }
    .nav-links { display: none; }
    .exp-item { grid-template-columns: 1fr; gap: 0; }
    .exp-year { padding: 0 0 0 1.6rem; }
    .exp-body { padding-top: 0.4rem; }
    .exp-body::before { top: 0.7rem; }
    .project-item { grid-template-columns: 1fr; }
    .project-meta { text-align: left; }
    .tab-content { padding: 1.5rem 1.2rem; }
    .orb { filter: blur(70px); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
    .reveal, .stagger, .hero-name .char, .hero-tags .tag { opacity: 1; transform: none; }

</style>

<body>

<script>
  const NAME = "Adarsh Verma";

  let openTabs = [], activeTab = null;

  /* ---- Name reveal ---- */
  function animateName() {
    const el = document.getElementById('hero-name');
    el.innerHTML = '';
    NAME.split('').forEach((ch, i) => {
      const span = document.createElement('span');
      span.className = 'char';
      span.textContent = ch === ' ' ? ' ' : ch;
      span.style.animationDelay = (0.2 + i * 0.05) + 's';
      el.appendChild(span);
    });
    const measure = () => {
      const total = el.offsetWidth;
      el.querySelectorAll('.char').forEach(span => {
        span.style.setProperty('--w', total + 'px');
        span.style.setProperty('--x', span.offsetLeft + 'px');
      });
    };
    measure();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);
    window.addEventListener('resize', measure, { passive: true });
  }

  /* ---- Hero tag stagger ---- */
  function animateTags() {
    document.querySelectorAll('.hero-tags .tag').forEach((tag, i) => {
      tag.style.animationDelay = (1.15 + i * 0.07) + 's';
    });
  }

  /* ---- Typewriter ---- */
  const PHRASES = [
    'responsive web experiences.',
    'smooth UI animations.',
    'MERN stack applications.',
    'clean, scalable frontends.'
  ];
  function typewriter() {
    const el = document.getElementById('typed');
    if (!el) return;
    let p = 0, c = 0, deleting = false;
    const tick = () => {
      const phrase = PHRASES[p];
      el.textContent = phrase.slice(0, c);
      let delay = deleting ? 38 : 70;
      if (!deleting && c === phrase.length) { delay = 1800; deleting = true; }
      else if (deleting && c === 0) { deleting = false; p = (p + 1) % PHRASES.length; delay = 350; }
      else c += deleting ? -1 : 1;
      setTimeout(tick, delay);
    };
    setTimeout(tick, 1300);
  }

  /* ---- Mouse spotlight ---- */
  function spotlight() {
    if (!window.matchMedia('(pointer: fine)').matches) return;
    const root = document.documentElement;
    let raf = null;
    window.addEventListener('mousemove', e => {
      document.body.classList.add('has-pointer');
      if (raf) return;
      raf = requestAnimationFrame(() => {
        root.style.setProperty('--mx', e.clientX + 'px');
        root.style.setProperty('--my', e.clientY + 'px');
        raf = null;
      });
    }, { passive: true });
  }

  /* ---- Content stagger ---- */
  function staggerContent(container) {
    const items = container.querySelectorAll('.section-header, .about-text, .skill-item, .project-item, .exp-item, .contact-item, .contact-note');
    items.forEach((el, i) => {
      el.classList.add('stagger');
      el.style.animationDelay = (60 + Math.min(i, 24) * 40) + 'ms';

    experience: `

          <div class="exp-body">

    contact: `

        <span class="status-dot"></span>currently a Junior Software Engineer @ Spunkads Pvt. Ltd.<br>
        open to interesting freelance/side projects and collaborations.

  };

  function openTab(id) {
    if (!openTabs.includes(id)) {
      openTabs.push(id);
      openTabs.sort((a, b) => TABS_ORDER.indexOf(a) - TABS_ORDER.indexOf(b));
    }
    activeTab = id;
    render();
    const bar = document.getElementById('tabs-bar');
    if (bar && window.innerWidth < 768) bar.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function closeTab(id, e) {
    e.stopPropagation();
    openTabs = openTabs.filter(t => t !== id);
    if (activeTab === id) activeTab = openTabs.length ? openTabs[openTabs.length - 1] : null;
    render();
  }

  function switchTab(id) {
    if (id === activeTab) return;
    activeTab = id;
    render();
  }

  function render() {
    const bar = document.getElementById('tabs-bar');
    const area = document.getElementById('tab-content-area');
    const noTabs = document.getElementById('no-tabs');

    if (openTabs.length === 0) {
      bar.style.display = 'none';
      area.innerHTML = '';
      noTabs.style.display = 'block';
      return;
    }

    noTabs.style.display = 'none';
    bar.style.display = 'flex';
    bar.innerHTML = openTabs.map(id => `
      <div class="tab ${id === activeTab ? 'active' : ''}" onclick="switchTab('${id}')" role="tab" aria-selected="${id === activeTab}">
        <span>${id}</span>
        <span class="tab-close" onclick="closeTab('${id}', event)" title="close">×</span>
      </div>`).join('');

    if (activeTab && CONTENT[activeTab]) {
      area.innerHTML = `<div class="tab-content">${CONTENT[activeTab]}</div>`;
      staggerContent(area);
    }
  }

  /* ---- Theme ---- */
  function applyTheme(theme) {
    document.documentElement.dataset.theme = theme;
    try { localStorage.setItem('theme', theme); } catch (_) {}
  }
  function toggleTheme() {
    const root = document.documentElement;
    root.classList.add('theming');
    applyTheme(root.dataset.theme === 'dark' ? 'light' : 'dark');
    setTimeout(() => root.classList.remove('theming'), 500);
  }

  /* ---- Init ---- */
  (function init() {
    let saved = null;
    try { saved = localStorage.getItem('theme'); } catch (_) {}
    document.documentElement.dataset.theme = saved || 'dark';
    document.getElementById('year').textContent = new Date().getFullYear();
    animateName();
    animateTags();
    typewriter();
    spotlight();
  })();
</script>
