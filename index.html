<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adarsh — Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Syne:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f4f0;
    --surface: #eeece6;
    --surface2: #e6e4dc;
    --border: rgba(0,0,0,0.10);
    --border-strong: rgba(0,0,0,0.18);
    --text: #1a1917;
    --text-muted: #6b6963;
    --text-faint: #a09d97;
    --tab-active-bg: #1a1917;
    --tab-active-text: #f5f4f0;
    --cursor: #1a1917;
    --tag-bg: #e0ddd4;
    --tag-text: #4a4844;
    --transition: 0.18s ease;
  }

  [data-theme="dark"] {
    --bg: #111110;
    --surface: #1c1b1a;
    --surface2: #252422;
    --border: rgba(255,255,255,0.08);
    --border-strong: rgba(255,255,255,0.15);
    --text: #ffffff;
    --text-muted: #ffffff;
    --text-faint: #504e4a;
    --tab-active-bg: #edeae4;
    --tab-active-text: #111110;
    --cursor: #edeae4;
    --tag-bg: #2a2927;
    --tag-text: #ffffff;
  }

  body {
    font-family: 'JetBrains Mono', monospace;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    transition: background var(--transition), color var(--transition);
    overflow-x: hidden;
  }

  .shell {
    width: 75%;
    max-width: 1100px;
    margin: 0 auto;
    padding: 2rem 0 4rem;
  }

  /* TOP BAR */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 3.5rem;
    padding-bottom: 1rem;
    border-bottom: 0.5px solid var(--border);
  }
  .topbar-left {
    font-size: 11px;
    color: var(--text-faint);
    letter-spacing: 0.08em;
  }
  .topbar-right {
    display: flex;
    align-items: center;
    gap: 1.4rem;
  }
  .nav-links { display: flex; gap: 1.4rem; }
  .nav-link {
    font-size: 12px;
    color: var(--text-muted);
    cursor: pointer;
    letter-spacing: 0.04em;
    transition: color var(--transition);
    background: none;
    border: none;
    padding: 0;
    font-family: 'JetBrains Mono', monospace;
  }
  .nav-link:hover { color: var(--text); }
  .nav-link::before { content: '~/'; opacity: 0.4; }

  /* THEME TOGGLE */
  .theme-toggle {
    width: 40px;
    height: 22px;
    background: var(--surface2);
    border: 0.5px solid var(--border-strong);
    border-radius: 11px;
    cursor: pointer;
    position: relative;
    transition: background var(--transition);
    flex-shrink: 0;
  }
  .theme-toggle::after {
    content: '';
    position: absolute;
    top: 3px; left: 3px;
    width: 14px; height: 14px;
    background: var(--text);
    border-radius: 50%;
    transition: transform 0.2s ease, background var(--transition);
  }
  [data-theme="dark"] .theme-toggle::after { transform: translateX(18px); }

  /* HERO */
  .hero { margin-bottom: 3rem; }
  .hero-prompt {
    font-size: 11px;
    color: var(--text-faint);
    margin-bottom: 0.6rem;
  }
  .hero-name {
    font-family: 'Syne', sans-serif;
    font-size: clamp(3rem, 5vw, 3rem);
    font-weight: 700;
    line-height: 0.9;
    letter-spacing: -0.03em;
    color: #00FF9f;
    display: inline-block;
  }
  .hero-name .char {
    display: inline-block;
    opacity: 0;
    transform: translateY(20px);
    animation: charIn 0.4s forwards;
  }
  @keyframes charIn { to { opacity: 1; transform: translateY(0); } }

  /* .cursor {
    display: inline-block;
    margin-left: 4px;
    vertical-align: baseline;
    animation: blink 1.1s step-end infinite;
  } */
   .cursor {
  display: inline-block;
  color: var(--cursor);
  animation: blink 1.1s step-end infinite;
  vertical-align: baseline;
}
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

  .hero-subtitle {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 1.1rem;
    letter-spacing: 0.02em;
  }
  .hero-subtitle span { color: var(--text); }
  .hero-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 1.2rem;
  }
  .tag {
    font-size: 10px;
    background: var(--tag-bg);
    color: var(--tag-text);
    padding: 3px 10px;
    border-radius: 2px;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.04em;
    border: 0.5px solid var(--border);
    transition: background var(--transition);
  }

  /* OPEN SECTION */
  .open-section { margin-bottom: 2rem; }
  .cmd-line {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 10px;
  }
  .cmd-line span { color: var(--text-faint); }
  .section-buttons { display: flex; flex-wrap: wrap; gap: 8px; }
  .section-btn {
    font-size: 11px;
    font-family: 'JetBrains Mono', monospace;
    background: var(--surface);
    border: 0.5px solid var(--border-strong);
    color: var(--text-muted);
    padding: 6px 14px;
    border-radius: 3px;
    cursor: pointer;
    transition: all var(--transition);
    letter-spacing: 0.03em;
  }
  .section-btn:hover { background: var(--surface2); color: var(--text); border-color: var(--text-faint); }
  .section-btn::before { content: 'open '; opacity: 0.4; }

  /* TABS BAR */
  .tabs-bar {
    display: flex;
    align-items: center;
    border-bottom: 0.5px solid var(--border-strong);
    overflow-x: auto;
    scrollbar-width: none;
    min-height: 34px;
  }
  .tabs-bar::-webkit-scrollbar { display: none; }
  .tab {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    font-family: 'JetBrains Mono', monospace;
    padding: 6px 14px;
    border-right: 0.5px solid var(--border);
    cursor: pointer;
    color: var(--text-muted);
    background: var(--surface);
    transition: all var(--transition);
    white-space: nowrap;
    border-top: 2px solid transparent;
    user-select: none;
  }
  .tab.active {
    background: var(--tab-active-bg);
    color: var(--tab-active-text);
    border-top: 2px solid var(--text);
  }
  .tab:hover:not(.active) { background: var(--surface2); color: var(--text); }
  .tab-close {
    width: 14px; height: 14px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 2px;
    font-size: 13px;
    opacity: 0.5;
    transition: opacity var(--transition), background var(--transition);
    font-family: sans-serif;
  }
  .tab-close:hover { opacity: 1; background: rgba(255,255,255,0.15); }
  .tab.active .tab-close:hover { background: rgba(0,0,0,0.12); }

  /* TAB CONTENT */
  .tab-content {
    border: 0.5px solid var(--border-strong);
    border-top: none;
    padding: 2rem;
    background: var(--surface);
    min-height: 280px;
    animation: fadeUp 0.2s ease;
    border-radius: 0 0 4px 4px;
  }
  @keyframes fadeUp { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }

  .no-tabs {
    text-align: center;
    padding: 3rem 0;
    color: var(--text-faint);
    font-size: 11px;
    letter-spacing: 0.05em;
    display: none;
  }

  /* SECTION CONTENT */
  .section-header {
    font-size: 10px;
    color: var(--text-faint);
    letter-spacing: 0.1em;
    margin-bottom: 1.5rem;
    text-transform: uppercase;
  }
  .section-header::before { content: '# '; opacity: 0.4; }

  /* About */
  .about-text {
    font-size: 13px;
    line-height: 1.9;
    color: var(--text-muted);
    max-width: 580px;
    margin-bottom: 1.5rem;
  }
  .about-text strong { color: var(--text); font-weight: 500; }
  .skills-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 7px;
    margin-top: 1rem;
  }
  .skill-item {
    font-size: 11px;
    color: var(--text-muted);
    padding: 6px 10px;
    background: var(--surface2);
    border: 0.5px solid var(--border);
    border-radius: 2px;
    display: flex; align-items: center; gap: 6px;
  }
  .skill-item::before { content: '›'; color: var(--text-faint); }

  /* Projects */
  .projects-list { display: flex; flex-direction: column; }
  .project-item {
    padding: 1rem 0;
    border-bottom: 0.5px solid var(--border);
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 1rem;
    align-items: start;
    cursor: pointer;
    transition: background var(--transition), padding var(--transition);
    border-radius: 2px;
  }
  .project-item:last-child { border-bottom: none; }
  .project-item:hover { background: var(--surface2); padding-left: 0.6rem; padding-right: 0.6rem; }
  .project-name {
    font-family: 'Syne', sans-serif;
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 4px;
  }
  .project-desc {
    font-size: 11px;
    color: var(--text-muted);
    line-height: 1.7;
  }
  .project-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 8px; }
  .project-meta {
    font-size: 10px;
    color: var(--text-faint);
    text-align: right;
    white-space: nowrap;
  }

  /* Experience */
  .exp-list { display: flex; flex-direction: column; }
  .exp-item {
    display: grid;
    grid-template-columns: 90px 1fr;
    gap: 1.5rem;
    padding: 1rem 0;
    border-bottom: 0.5px solid var(--border);
  }
  .exp-item:last-child { border-bottom: none; }
  .exp-year { font-size: 10px; color: var(--text-faint); padding-top: 2px; line-height: 1.6; }
  .exp-role {
    font-family: 'Syne', sans-serif;
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 3px;
  }
  .exp-company { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; }
  .exp-desc { font-size: 11px; color: var(--text-muted); line-height: 1.7; }

  /* Contact */
  .contact-list { display: flex; flex-direction: column; }
  .contact-item {
    display: flex; align-items: center; gap: 1rem;
    padding: 0.8rem 0;
    border-bottom: 0.5px solid var(--border);
  }
  .contact-item:last-child { border-bottom: none; }
  .contact-label { font-size: 10px; color: var(--text-faint); width: 80px; flex-shrink: 0; letter-spacing: 0.06em; }
  .contact-value {
    font-size: 12px;
    color: var(--text);
    text-decoration: none;
    transition: color var(--transition);
  }
  .contact-value:hover { color: var(--text-muted); }
  .contact-note { font-size: 11px; color: var(--text-muted); margin-top: 1.5rem; line-height: 1.8; }

  /* Status dot */
  .status-dot {
    width: 6px; height: 6px;
    background: #22c55e;
    border-radius: 50%;
    display: inline-block;
    margin-right: 5px;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  /* FOOTER */
  .footer {
    margin-top: 3rem;
    padding-top: 1rem;
    border-top: 0.5px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .footer-left { font-size: 10px; color: var(--text-faint); }
  .footer-right { font-size: 10px; color: var(--text-faint); }

  @media (max-width: 768px) {
    .shell { width: 92%; }
    .exp-item { grid-template-columns: 1fr; gap: 0.3rem; }
    .hero-name { font-size: 2.8rem; }
    .nav-links { display: none; }
  }
</style>
</head>

          <div class="project-desc">Solved 200+ problems across LeetCode and GeeksforGeeks covering arrays, trees, graphs, dynamic programming, and more. Focused on writing clean, optimized solutions.</div>

      </div>
      <div class="contact-note">
        <span class="status-dot"></span>currently open to full-time roles and interesting side projects.<br>
        looking for software developer role.
      </div>`
  };

  function openTab(id) {
    if (!openTabs.includes(id)) {
      openTabs.push(id);
      openTabs.sort((a, b) => TABS_ORDER.indexOf(a) - TABS_ORDER.indexOf(b));
    }
    activeTab = id;
    render();
  }

  function closeTab(id, e) {
    e.stopPropagation();
    openTabs = openTabs.filter(t => t !== id);
    if (activeTab === id) activeTab = openTabs.length ? openTabs[openTabs.length - 1] : null;
    render();
  }

  function switchTab(id) { activeTab = id; render(); }

  function render() {
    const bar = document.getElementById('tabs-bar');
    const area = document.getElementById('tab-content-area');
    const noTabs = document.getElementById('no-tabs');

    if (openTabs.length === 0) {
      bar.style.display = 'none';
      area.innerHTML = '';
      noTabs.style.display = 'block';
      return;
    }

    noTabs.style.display = 'none';
    bar.style.display = 'flex';
    bar.innerHTML = openTabs.map(id => `
      <div class="tab ${id === activeTab ? 'active' : ''}" onclick="switchTab('${id}')">
        <span>${id}</span>
        <span class="tab-close" onclick="closeTab('${id}', event)">×</span>
      </div>`).join('');

    if (activeTab && CONTENT[activeTab]) {
      area.innerHTML = `<div class="tab-content">${CONTENT[activeTab]}</div>`;
    }
  }

  function toggleTheme() {
    const d = document.documentElement;
